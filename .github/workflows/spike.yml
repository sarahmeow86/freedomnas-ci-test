name: spike

on:
  workflow_dispatch:
    inputs:
      images:
        description: images to build after the live ISO (JSON list)
        default: '["debian"]'
      freebsd:
        description: also build the FreeBSD live ISO and image
        type: boolean
        default: false
      live_from_run:
        description: reuse the live ISO of this earlier run id (empty = build it)
        default: ''

permissions:
  contents: read
  actions: read

env:
  REPOS: core profiles installer webui docs image-builder

jobs:
  live-iso:
    if: inputs.live_from_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Machine
        run: |
          nproc; free -h; df -h / /mnt; ls -l /dev/kvm || true

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq arch-install-scripts gnupg rsync xz-utils curl python3-venv zstd xorriso

      - name: Clone the sources from Codeberg
        run: |
          for r in $REPOS; do
            git clone -q --depth 1 --branch dev "https://codeberg.org/FreedomNAS/freedomnas-$r.git" "freedomnas-$r"
          done
          git clone -q --depth 1 --branch main https://codeberg.org/FreedomNAS/freedomnas-overlay.git freedomnas-overlay
          for r in freedomnas-*; do echo "$r $(git -C "$r" log --oneline -1)"; done

      - name: Build the live ISO
        run: |
          start=$(date +%s)
          sudo env FNAS_CHANNEL=dev FNAS_LIVE_WORK=/mnt/freedomnas-live \
            freedomnas-image-builder/live/build.sh "$PWD/freedomnas-live.iso"
          echo "live ISO built in $(( ($(date +%s) - start) / 60 )) min"
          ls -l freedomnas-live.iso
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: live-iso
          path: freedomnas-live.iso
          retention-days: 1
          compression-level: 0

  image:
    needs: live-iso
    if: ${{ !cancelled() && (needs.live-iso.result == 'success' || inputs.live_from_run != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - name: Machine
        run: |
          nproc; free -h; df -h /; ls -l /dev/kvm

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso rsync zstd python3-venv

      - name: Clone the sources from Codeberg
        run: |
          for r in $REPOS; do
            git clone -q --depth 1 --branch dev "https://codeberg.org/FreedomNAS/freedomnas-$r.git" "freedomnas-$r"
          done

      - uses: actions/download-artifact@v4
        with:
          name: live-iso
          path: ci
          run-id: ${{ inputs.live_from_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Build the image
        run: |
          case "${{ matrix.image }}" in
            artix-*) edition=artix init=${{ matrix.image }}; init=${init#artix-} ;;
            *) edition=${{ matrix.image }} init= ;;
          esac
          start=$(date +%s)
          sudo env FNAS_LIVE_ISO="$PWD/ci/freedomnas-live.iso" FNAS_CHANNEL=dev \
            sh freedomnas-image-builder/$edition/build.sh $init \
            "$PWD/freedomnas-image-builder/$edition/${{ matrix.image }}.img"
          echo "${{ matrix.image }} built in $(( ($(date +%s) - start) / 60 )) min"
          ls -l freedomnas-image-builder/$edition/
          df -h /

      - name: Install log
        if: always()
        run: tail -n 60 freedomnas-image-builder/*/*.install.log 2>/dev/null || true

  freebsd-live-iso:
    if: inputs.freebsd
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Machine
        run: |
          nproc; free -h; df -h /; ls -l /dev/kvm

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso xz-utils rsync python3-venv

      - name: Clone the sources from Codeberg
        run: |
          for r in $REPOS; do
            git clone -q --depth 1 --branch dev "https://codeberg.org/FreedomNAS/freedomnas-$r.git" "freedomnas-$r"
          done

      - name: Build the FreeBSD live ISO
        run: |
          start=$(date +%s)
          sudo env FNAS_CHANNEL=dev FNAS_CACHE_DIR="$RUNNER_TEMP/freebsd-cache" FREEBSD_BACKEND=qemu \
            freedomnas-image-builder/freebsd/live.sh "$PWD/freedomnas-live-freebsd.iso"
          echo "FreeBSD live ISO built in $(( ($(date +%s) - start) / 60 )) min"
          ls -l freedomnas-live-freebsd.iso

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-live-iso
          path: freedomnas-live-freebsd.iso
          retention-days: 1
          compression-level: 0

  freebsd-image:
    needs: freebsd-live-iso
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso xz-utils rsync zstd python3-venv

      - name: Clone the sources from Codeberg
        run: |
          for r in $REPOS; do
            git clone -q --depth 1 --branch dev "https://codeberg.org/FreedomNAS/freedomnas-$r.git" "freedomnas-$r"
          done

      - uses: actions/download-artifact@v4
        with:
          name: freebsd-live-iso
          path: ci

      - name: Build the image
        run: |
          start=$(date +%s)
          sudo env FNAS_FREEBSD_LIVE_ISO="$PWD/ci/freedomnas-live-freebsd.iso" FNAS_CHANNEL=dev \
            sh freedomnas-image-builder/freebsd/build.sh "$PWD/freedomnas-image-builder/freebsd/freebsd.img"
          echo "freebsd built in $(( ($(date +%s) - start) / 60 )) min"
          ls -l freedomnas-image-builder/freebsd/

      - name: Install log
        if: always()
        run: tail -n 60 freedomnas-image-builder/freebsd/*.install.log 2>/dev/null || true
